services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    container_name: mealie
    restart: 'unless-stopped'
    ports:
        - "9000:9000" 
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie_data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 100
      TZ: Europe/Paris
      #BASE_URL: https://mealie.yourdomain.com don't have a domaine now do i need one ?
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
    depends_on:
      database:
        condition: service_healthy

volumes:
  mealie_data:
