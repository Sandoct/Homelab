services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:100
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ~/homelab-data/jellyfin/config:/config
      - ~/homelab-data/jellyfin/cache:/cache
      - type: bind
        source: ~/media
        target: /media
        read_only: true
    restart: 'unless-stopped'
